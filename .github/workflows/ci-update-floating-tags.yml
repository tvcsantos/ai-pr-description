name: Update Floating Tags (CI)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: update-floating-tags
  cancel-in-progress: false

jobs:
  main:
    name: Update Floating Tags
    # Exclude prerelease and build-metadata tags from stable floating aliases.
    if: "!contains(github.ref_name, '-') && !contains(github.ref_name, '+')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update floating version tag
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable release tag such as v1.2.3."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MAJOR_TAG="v${MAJOR}"

          echo "Release version: $VERSION"
          echo "Major tag: $MAJOR_TAG"

          COMMIT_SHA="$(git rev-parse --verify "refs/tags/$VERSION^{commit}")"
          echo "Target commit: $COMMIT_SHA"

          update_tag() {
            local TAG_NAME="$1"
            local TARGET_SHA="$2"
            local VERSION_PATTERN="$3"
            local LATEST_VERSION
            local EXPECTED_SHA

            LATEST_VERSION="$(git tag --list | grep -E "$VERSION_PATTERN" | sort -V | tail -n 1)"
            if [ "$LATEST_VERSION" != "$VERSION" ]; then
              echo "Skipping $TAG_NAME: $LATEST_VERSION is newer than $VERSION." >> "$GITHUB_STEP_SUMMARY"
              return
            fi

            EXPECTED_SHA="$(git ls-remote --refs origin "refs/tags/$TAG_NAME" | cut -f1)"
            git update-ref "refs/tags/$TAG_NAME" "$TARGET_SHA"
            git push --force-with-lease="refs/tags/$TAG_NAME:$EXPECTED_SHA" origin "refs/tags/$TAG_NAME"
            echo "Updated $TAG_NAME to $VERSION ($TARGET_SHA)." >> "$GITHUB_STEP_SUMMARY"
          }

          update_tag "$MAJOR_TAG" "$COMMIT_SHA" "^v${MAJOR}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
