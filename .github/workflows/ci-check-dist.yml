name: Check Transpiled JavaScript

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-dist:
    name: Check Dist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Versu Node Plugin
        run: npm install --global '@versu/plugin-node@^1.0.8'

      - name: Preview next release
        uses: versuhq/versu@v3
        with:
          strip-module-prefix: true
          tag-version-prefix: v
          dry-run: true
          push-changes: false
          create-tags: false
          generate-release-notes: false
          generate-changelog: false

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build dist
        run: npm run bundle

      - name: Check for uncommitted dist changes
        run: git diff --exit-code -- dist/
