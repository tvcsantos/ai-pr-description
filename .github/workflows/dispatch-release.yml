name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the release without writing or pushing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create versioned release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Configure the RELEASE_TOKEN repository secret so release tag pushes can trigger the floating-tag workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Unlike GITHUB_TOKEN, this token allows tag pushes to trigger CI.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install Node.js adapter
        run: npm install --global '@versu/plugin-node@^1.0.8'

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Versu
        id: versu
        uses: versuhq/versu@v3
        with:
          strip-module-prefix: true
          tag-version-prefix: v
          dry-run: ${{ inputs.dry-run }}

      - name: Create GitHub releases
        if: steps.versu.outputs.bumped == 'true' && !inputs.dry-run
        uses: actions/github-script@v9
        env:
          CREATED_TAGS: ${{ steps.versu.outputs.created-tags }}
          NOTES_PATHS: ${{ steps.versu.outputs.release-notes-paths }}
        with:
          script: |
            const fs = require("fs");

            const createdTags = JSON.parse(process.env.CREATED_TAGS);
            const notesPaths = JSON.parse(process.env.NOTES_PATHS);

            for (const { moduleId, tag } of createdTags) {
              const notes = notesPaths.find((entry) => entry.moduleId === moduleId);
              if (!notes) {
                core.warning(`Missing Versu release notes for ${tag} (module ${moduleId}); skipping release creation.`);
                continue;
              }

              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: tag,
                body: fs.readFileSync(notes.path, "utf8"),
                generate_release_notes: false,
              });
            }
